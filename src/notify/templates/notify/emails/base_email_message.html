{% load static %}
{% load common_tags %}
<html>
  <head>
    <style>
     /* Blue/white, single-accent design: a slim primary (Trust Blue) bar tops a plain white card -- no
        decorative frames. Gold is not chrome here; it appears only on .email-button, the one action
        (matching the app rule that gold marks a single primary action). Colors are hardcoded because
        email clients do not honor CSS variables. */
      body { margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f6f8; }
     .email-container { max-width: 600px; margin: 0 auto; background-color: #ffffff;
                        border: 1px solid #cbd5e1; border-top: 4px solid #1f5f8b; }
     .email-inner { padding: 0; margin: 0; }
     .email-header { border-bottom: 1px solid #e2e8f0; }
     .email-header tr { background-color: #ffffff; }
     .email-logo { width: 149px; padding-left: 8px; padding-right: 8px; }
     .email-title { font-size: 18px; font-weight: 800; color: #1f5f8b; padding-left: 8px; padding-right: 8px; }
     .email-content { margin: 8px; }
     .email-button { display: inline-block; background-color: #f5b945; color: #1e293b;
                     font-weight: bold; text-decoration: none; padding: 10px 18px; border-radius: 4px; }
     .email-unsubscribe { margin: 8px; color: #888888; font-size: 0.8rem; text-decoration: none; }
     img.logo { width: 133px; height: auto; }
    </style>
  </head>
  <body>
    <div class="email-container">
      <div class="email-inner">
        <div class="email-header">
          {% block body %}
          <table style="width: 100%;" cellpadding="0" cellspacing="0">
            <tr>
              <td class="email-logo">
                {% block logo %}
                {% if BASE_URL %}
                <a href="{{ BASE_URL }}" alt="{% settings_value 'SITE_NAME' %} Home">
                  <img class="logo" src="{{ BASE_URL }}{% static 'img/app-logo-h64.png' %}"
                       alt="{% settings_value 'SITE_NAME' %} Logo"/>
                </a>
                {% endif %}
                {% endblock %}
              </td>
              <td>
                <p class="email-title">
                  {% block title %}
                  {% endblock %}
                </p>
              </td>
            </tr>
          </table>
          {% endblock %}
        </div>
        <div class="email-content">
          {% block content %}
          {% endblock %}
        </div>
        {% if UNSUBSCRIBE_URL %}
        <hr />
        <p class="email-unsubscribe">
          <a href="{{ UNSUBSCRIBE_URL }}">Unsubscribe</a>
        </p>
        {% endif %}
      </div>
    </div>
  </body>
</html>
