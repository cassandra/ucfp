{% extends "pages/base.html" %}

{% block content %}
<div class="container py-5 text-center" style="max-width: 40rem;">
  <h1 class="h3">You have been unsubscribed.</h1>
  <p class="text-muted">"{{ email }}" will no longer receive email from us, including sign-in codes,
    so it can no longer be used to sign in until re-enabled.</p>
  <p>Changed your mind, or need to sign in again?
    <a href="{{ resubscribe_url }}">Re-enable emails</a>.</p>
</div>
{% endblock %}
