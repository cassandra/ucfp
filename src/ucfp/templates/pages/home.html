{% extends "pages/app_base.html" %}
{% load common_tags %}

{% block app_content %}
<div class="text-center py-5">
  <h1 class="text-primary mb-3">{% settings_value 'SITE_NAME' %}</h1>
  <p class="lead text-muted mb-4">Plan your financial future.</p>
  {% if not input_state.has_profile %}
  <a href="{% url 'flow_profile' %}" class="btn btn-primary btn-lg">Set up your profile</a>
  {% else %}
  <a href="{% url 'scenarios_home' %}" class="btn btn-primary btn-lg">Manage your scenarios</a>
  {% endif %}
</div>
{% endblock %}
