<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* Animation is CSS @keyframes so it runs when the SVG is used as an
         &lt;img&gt; (no external JS). Landfall brand: the logo's rayed sun,
         with its fan of rays sweeping around the disc as the loading cue. */
      .panel { filter: drop-shadow(0 4px 12px rgba(16, 24, 40, 0.18)); }
      .rays  { transform-origin: 64px 64px; animation: sweep 1.1s linear infinite; }
      .disc  { transform-origin: 64px 64px; animation: breathe 2.2s ease-in-out infinite; }

      @keyframes sweep   { to { transform: rotate(360deg); } }
      @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

      /* Respect a user's reduced-motion preference: hold a static sun. */
      @media (prefers-reduced-motion: reduce) {
        .rays, .disc { animation: none; }
      }
    </style>
  </defs>

  <!-- Light backdrop chip: keeps the mark legible over any page content -->
  <circle class="panel" cx="64" cy="64" r="52" fill="#ffffff"
          stroke="#1f5f8b" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Fan of rays: one ray shape placed across the top 180 degrees, with a
       graduated opacity so a bright leading edge sweeps around while spinning. -->
  <g class="rays" fill="none" stroke="#1f5f8b" stroke-width="5" stroke-linecap="round">
    <path d="M64 41 L64 30" transform="rotate(90 64 64)"  stroke-opacity="1"/>
    <path d="M64 41 L64 30" transform="rotate(60 64 64)"  stroke-opacity="0.82"/>
    <path d="M64 41 L64 30" transform="rotate(30 64 64)"  stroke-opacity="0.66"/>
    <path d="M64 41 L64 30" transform="rotate(0 64 64)"   stroke-opacity="0.52"/>
    <path d="M64 41 L64 30" transform="rotate(-30 64 64)" stroke-opacity="0.40"/>
    <path d="M64 41 L64 30" transform="rotate(-60 64 64)" stroke-opacity="0.30"/>
    <path d="M64 41 L64 30" transform="rotate(-90 64 64)" stroke-opacity="0.22"/>
  </g>

  <!-- Center disc: static sun, with a gentle breathe so the core feels alive -->
  <circle class="disc" cx="64" cy="64" r="15" fill="#1f5f8b"/>
</svg>
