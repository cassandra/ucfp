{% load humanize %}
{% comment %}
  One heatmap cell (results.HeatCell `cell`): a shaded link to its strategy's detail. antinode swaps the
  detail into #ss-detail; results.js moves the gold selection to the matching cell and ranked row.
{% endcomment %}
<a class="ss-hm-cell hm-b{{ cell.bucket }}{% if cell.is_best %} best{% endif %}{% if cell.is_selected %} sel{% endif %}"
   data-combo="{{ cell.combo }}" data-async="#ss-detail"
   href="{% url 'calculators:ss_timing:detail' cell.combo %}"
   aria-label="{% if cell.lower_age %}Higher earner claims at {{ cell.higher_age }}, lower at {{ cell.lower_age }}{% else %}Claim at {{ cell.higher_age }}{% endif %}, total ${{ cell.raw_total|floatformat:0|intcomma }}, value ${{ cell.effective_value|floatformat:0|intcomma }}"
   title="{% if cell.lower_age %}Higher {{ cell.higher_age }}, lower {{ cell.lower_age }}{% else %}Age {{ cell.higher_age }}{% endif %} — Total ${{ cell.raw_total|floatformat:0|intcomma }} · ${{ cell.effective_value|floatformat:0|intcomma }}"></a>
