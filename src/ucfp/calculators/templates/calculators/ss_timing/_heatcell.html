{% load humanize %}
{% comment %}
  One heatmap cell (results.HeatCell `cell`): a shaded link to its strategy's detail. antinode swaps the
  detail into #ss-detail; results.js moves the gold selection to the matching cell and ranked row.
{% endcomment %}
<a class="ss-hm-cell hm-b{{ cell.bucket }}{% if cell.is_best %} best{% endif %}{% if cell.is_selected %} sel{% endif %}"
   data-combo="{{ cell.combo }}"{% if cell.is_selected %} aria-current="true"{% endif %} data-async="#ss-detail"
   href="{% url 'calculators:ss_timing:detail' cell.combo %}"
   aria-label="{% if cell.lower_age %}Higher earner claims at {{ cell.higher_age }}, lower at {{ cell.lower_age }}{% else %}Claim at {{ cell.higher_age }}{% endif %}. Total ${{ cell.raw_total|floatformat:0|intcomma }}, present value ${{ cell.present_value|floatformat:0|intcomma }}{% if is_opportunity_cost %}, effective value ${{ cell.effective_value|floatformat:0|intcomma }}{% endif %}"
   title="{% if cell.lower_age %}Higher {{ cell.higher_age }}, lower {{ cell.lower_age }}{% else %}Age {{ cell.higher_age }}{% endif %}&#10;Total: ${{ cell.raw_total|floatformat:0|intcomma }}&#10;Present value: ${{ cell.present_value|floatformat:0|intcomma }}{% if is_opportunity_cost %}&#10;Effective value: ${{ cell.effective_value|floatformat:0|intcomma }}{% endif %}"></a>
