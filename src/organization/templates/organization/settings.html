{% extends "pages/base.html" %}

{% block content %}
<div class="container py-4">
  <h1 class="mb-3">Organization settings</h1>

  <form method="post" action="{% url 'organization_settings' %}">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label" for="{{ form.currency.id_for_label }}">Currency</label>
      {{ form.currency }}
      {% if form.currency.errors %}
      <div class="text-danger small">{{ form.currency.errors|join:" " }}</div>
      {% endif %}
      <div class="form-text">Used to display all monetary values. All planning uses this single
        currency.</div>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'retirement_planning' %}" class="btn btn-outline-secondary">Back</a>
  </form>
</div>
{% endblock %}
