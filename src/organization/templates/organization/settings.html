{% extends "pages/app_base.html" %}

{% block app_content %}
<h1 class="mb-3">Organization settings</h1>

<form method="post" action="{% url 'organization_settings' %}">
  {% csrf_token %}
  <div class="form-group">
    <label for="{{ form.currency.id_for_label }}">Currency</label>
    {{ form.currency }}
    {% if form.currency.errors %}
    <div class="text-danger small">{{ form.currency.errors|join:" " }}</div>
    {% endif %}
    <small class="form-text text-muted">Used to display all monetary values. All planning uses this
      single currency.</small>
  </div>
  <button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
