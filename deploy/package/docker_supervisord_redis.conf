# Bundled-redis supervisor program for the self-host lane. This file ships to
# /etc/supervisor/available/ (NOT auto-included); the entrypoint copies it into
# /etc/supervisor/conf.d/ only when UCFP_BUNDLED_REDIS is true. The cloud lane
# leaves it disabled and connects to host redis instead.
[program:redis]
command=/usr/bin/redis-server
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/redis.log
stderr_logfile=/var/log/supervisor/redis_err.log
priority=10
